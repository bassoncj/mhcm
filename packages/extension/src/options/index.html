<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Community Marketplace Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 24px;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 24px;
      color: #fff;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #4a90d9;
    }
    .help {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    button {
      margin-top: 16px;
      padding: 8px 20px;
      background: #4a90d9;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover {
      background: #3a7bc8;
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #4caf50;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <h1>Community Marketplace Settings</h1>

  <label for="server-url">Server URL</label>
  <input
    id="server-url"
    type="text"
    placeholder="wss://your-server.com:port"
  />
  <div class="help">
    WebSocket URL of your marketplace server.
    Use <code>ws://</code> for local or <code>wss://</code> for HTTPS.
  </div>

  <button id="save">Save</button>
  <div class="status" id="status"></div>

  <script src="./options.ts" type="module"></script>
</body>
</html>
